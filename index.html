<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rigging Markout</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

#importScreen { padding: 1.25rem; max-width: 600px; margin: 0 auto; }
#importScreen h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
#importScreen > p { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
.drop-area { border: 2px dashed #444; border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; background: #1a1a1a; margin-bottom: 1rem; display: block; }
.drop-area:active { background: #222; }
.drop-area p { font-size: 14px; color: #888; margin: 0; }
.drop-area input { display: none; }
.or-line { display: flex; align-items: center; gap: 10px; margin: 1rem 0; font-size: 12px; color: #555; }
.or-line::before, .or-line::after { content: ''; flex: 1; height: 1px; background: #333; }
textarea { width: 100%; min-height: 100px; background: #1a1a1a; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 13px; font-family: 'Courier New', monospace; padding: 10px; resize: vertical; outline: none; display: block; }
textarea:focus { border-color: #666; }
.btn-row { display: flex; gap: 10px; margin-top: 1rem; }
.btn-primary { flex: 1; padding: 14px; background: #fff; color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-primary:active { opacity: 0.85; }
.btn-sample { padding: 14px 18px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 10px; font-size: 14px; cursor: pointer; }
.err { margin-top: 1rem; padding: 12px; background: #3b0000; border-radius: 10px; color: #f87171; font-size: 13px; }
.legend-wrap { margin-top: 1.5rem; padding: 1rem; background: #1a1a1a; border-radius: 10px; }
.legend-wrap p { font-size: 11px; color: #555; margin-bottom: 10px; font-weight: 600; }
.legend-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
.leg-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.leg-item span { font-size: 9px; color: #666; text-align: center; line-height: 1.2; }

#viewScreen { display: none; height: 100vh; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #111; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
.btn-ds { background: #fff; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-width: 70px; }
.slsr { display: flex; align-items: center; }
.btn-slsr { background: #222; border: none; color: #fff; padding: 8px 12px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; }
.sep { color: #555; padding: 0 4px; }
.btn-back { background: #222; border: none; color: #aaa; padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }
.btn-swap { background: #222; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-swap.active { background: #f5a020; color: #000; border-color: #f5a020; }
.btn-reset { background: #222; border: 1px solid #555; color: #aaa; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }

.total-bar { padding: 5px 14px; font-size: 11px; color: #555; border-bottom: 1px solid #222; text-align: center; flex-shrink: 0; }
.grid-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: 1fr 76px 1fr; }
.col-hdr { background: #1a1a1a; padding: 5px 10px; font-size: 11px; color: #555; font-weight: 600; letter-spacing: 0.05em; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 5; }
.col-hdr.sl { text-align: right; border-right: 1px solid #222; }
.col-hdr.mid { text-align: center; }
.col-hdr.sr { text-align: left; border-left: 1px solid #222; }
.row-mid { background: #111; border-bottom: 1px solid #222; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 3px; min-height: 60px; }
.row-mid .dl { font-size: 10px; color: #777; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 2px; }
.row-mid .yv { font-size: 19px; font-weight: 600; color: #fff; line-height: 1; }
.row-mid.null-row { background: #16a34a; }
.row-mid.null-row .yv, .row-mid.null-row .dl { color: #fff; }
.cell { border-bottom: 1px solid #222; padding: 8px 10px; display: flex; align-items: center; min-height: 60px; }
.cell.sl { justify-content: flex-end; border-right: 1px solid #222; }
.cell.sr { justify-content: flex-start; border-left: 1px solid #222; }

.mc { display: flex; align-items: center; gap: 7px; max-width: 100%; cursor: pointer; -webkit-user-select: none; user-select: none; }
.mc.sl { flex-direction: row-reverse; }
.mc-meta { display: flex; flex-direction: column; min-width: 0; }
.mc.sl .mc-meta { align-items: flex-end; }
.mn { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85px; display: block; }
.mx { font-size: 10px; color: #666; display: block; }
.mc.done .mn { color: #333; text-decoration: line-through; }
.mc.done .mx { color: #2a2a2a; }
.mc.done svg { opacity: 0.15; }
.check-dot { width: 20px; height: 20px; min-width: 20px; border-radius: 50%; border: 1.5px solid #444; display: flex; align-items: center; justify-content: center; }
.mc.done .check-dot { background: #22c55e; border-color: #22c55e; }
.check-mark { display: none; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); }
.mc.done .check-mark { display: block; }
</style>
</head>
<body>

<div id="importScreen">
  <h1>Rigging Markout</h1>
  <p>CSV aus Vectorworks importieren</p>
  <label class="drop-area" id="dropArea">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>Tippen zum Auswählen oder CSV ablegen</p>
    <input type="file" accept=".csv,text/plain" id="fileInput">
  </label>
  <div class="or-line">oder</div>
  <textarea id="csvText" placeholder="CSV hier einfügen&#10;Spalten: Name, X, Y, Tragfähigkeit (kg)"></textarea>
  <div class="btn-row">
    <button class="btn-primary" onclick="parseAndShow()">Importieren</button>
    <button class="btn-sample" onclick="loadSample()">Beispiel</button>
  </div>
  <div id="errBox" class="err" style="display:none;"></div>
  <div class="legend-wrap">
    <p>Symbole — Form + Farbe nach Tragfähigkeit</p>
    <div class="legend-grid" id="legendGrid"></div>
  </div>
</div>

<div id="viewScreen">
  <div class="topbar">
    <button class="btn-ds" id="dirBtn" onclick="toggleDir()">↑ DS</button>
    <div class="slsr">
      <button class="btn-slsr">◀ SL</button>
      <span class="sep">|</span>
      <button class="btn-slsr">SR ▶</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="btn-swap" id="swapBtn" onclick="toggleSwap()">X↔Y</button>
      <button class="btn-reset" onclick="resetDone()">✓ Reset</button>
      <button class="btn-back" onclick="goBack()">← CSV</button>
    </div>
  </div>
  <div id="totalBar" class="total-bar"></div>
  <div class="grid-scroll">
    <div class="grid">
      <div class="col-hdr sl">SL</div>
      <div class="col-hdr mid">Y</div>
      <div class="col-hdr sr">SR</div>
      <div id="gridBody" style="display:contents;"></div>
    </div>
  </div>
</div>

<script>
// ── BR Symbol System ──────────────────────────────────────────────────

function weightToShape(kg) {
  if (kg <= 0)    return 'dia';
  if (kg <= 320)  return 'dia';
  if (kg <= 500)  return 'tri';
  if (kg <= 1250) return 'circ';
  if (kg <= 2000) return 'sq';
  return 'hex';
}

function weightToColors(kg) {
  const Y = '#e8d820';
  if (kg <= 0)    return { a:'#555', b:'#333' };
  if (kg <= 125)  return { a:'#b8dc30', b:'#70c8e8' };
  if (kg <= 160)  return { a:'#70c8e8', b:'#50a8c8' };
  if (kg <= 200)  return { a:'#60c0e0', b:'#4090b0' };
  if (kg <= 250)  return { a:'#28a030', b:'#186820' };
  if (kg <= 320)  return { a:'#b89040', b:'#806020' };
  if (kg <= 500)  return { a:'#f09010', b:'#c05000' };
  if (kg <= 750)  return { a:'#00a8c0', b:'#006880' };
  if (kg <= 1000) return { a:'#e01050', b:'#a00030' };
  if (kg <= 1250) return { a:'#909090', b:'#606060' };
  if (kg <= 1500) return { a:'#8818b0', b:'#601880' };
  if (kg <= 2000) return { a:'#1050d0', b:'#0830a0' };
  return              { a:'#d870d8', b:'#a040a0' };
}

function brMotorSVG(name, kg, pre, S) {
  S = S || 32;
  const isDH = name && name.toUpperCase().startsWith('DH');
  const shape = isDH ? 'dh' : weightToShape(kg);
  const col = weightToColors(kg);
  const cx = S/2, cy = S/2;
  const sw = Math.max(1.5, S/20);
  const Y = '#e8d820';
  const A = col.a;
  const B = col.b;
  const oc = pre ? '#e82020' : '#444';
  const ow = pre ? sw*1.6 : sw;
  const uid = Math.random().toString(36).slice(2,7);

  if (shape === 'dia') {
    const m = ow/2+0.5;
    const pts = { t:`${cx},${m}`, r:`${S-m},${cy}`, b:`${cx},${S-m}`, l:`${m},${cy}`, c:`${cx},${cy}` };
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <polygon points="${pts.t} ${pts.r} ${pts.c}" fill="${Y}"/>
      <polygon points="${pts.r} ${pts.b} ${pts.c}" fill="#111"/>
      <polygon points="${pts.b} ${pts.l} ${pts.c}" fill="${A}"/>
      <polygon points="${pts.l} ${pts.t} ${pts.c}" fill="#111"/>
      <polygon points="${pts.t} ${pts.r} ${pts.b} ${pts.l}" fill="none" stroke="${oc}" stroke-width="${ow}" stroke-linejoin="round"/>
    </svg>`;
  }

  if (shape === 'tri') {
    const m = ow/2+0.5;
    const tx=cx, ty=m, bl=m, br=S-m, by=S-m;
    const gcx=(tx+bl+br)/3, gcy=(ty+by+by)/3;
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <polygon points="${tx},${ty} ${br},${by} ${bl},${by}" fill="${A}"/>
      <polygon points="${tx},${ty} ${gcx},${gcy} ${bl},${by}" fill="#111"/>
      <polygon points="${tx},${ty} ${br},${by} ${gcx},${gcy}" fill="${Y}"/>
      <polygon points="${tx},${ty} ${br},${by} ${bl},${by}" fill="none" stroke="${oc}" stroke-width="${ow}" stroke-linejoin="round"/>
    </svg>`;
  }

  if (shape === 'circ') {
    const r = S/2 - ow/2 - 0.5;
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <clipPath id="c${uid}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${A}"/>
      <rect x="${cx}" y="${ow}" width="${r}" height="${cy-ow}" fill="${Y}" clip-path="url(#c${uid})"/>
      <rect x="${cx}" y="${cy}" width="${r}" height="${cy}" fill="#111" clip-path="url(#c${uid})"/>
      <rect x="${ow}" y="${cy}" width="${cx-ow}" height="${cy}" fill="${B}" clip-path="url(#c${uid})"/>
      <line x1="${cx}" y1="${ow}" x2="${cx}" y2="${S-ow}" stroke="${oc}" stroke-width="${sw*0.5}" opacity="0.4"/>
      <line x1="${ow}" y1="${cy}" x2="${S-ow}" y2="${cy}" stroke="${oc}" stroke-width="${sw*0.5}" opacity="0.4"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${oc}" stroke-width="${ow}"/>
    </svg>`;
  }

  if (shape === 'sq') {
    const p = ow/2+0.5;
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <rect x="${p}" y="${p}" width="${cx-p}" height="${cy-p}" fill="${A}"/>
      <rect x="${cx}" y="${p}" width="${cx-p}" height="${cy-p}" fill="${Y}"/>
      <rect x="${p}" y="${cy}" width="${cx-p}" height="${cy-p}" fill="${Y}"/>
      <rect x="${cx}" y="${cy}" width="${cx-p}" height="${cy-p}" fill="#111"/>
      <line x1="${cx}" y1="${p}" x2="${cx}" y2="${S-p}" stroke="${oc}" stroke-width="${sw*0.5}" opacity="0.4"/>
      <line x1="${p}" y1="${cy}" x2="${S-p}" y2="${cy}" stroke="${oc}" stroke-width="${sw*0.5}" opacity="0.4"/>
      <rect x="${p}" y="${p}" width="${S-p*2}" height="${S-p*2}" fill="none" stroke="${oc}" stroke-width="${ow}"/>
    </svg>`;
  }

  if (shape === 'hex') {
    const r = S/2 - ow/2 - 0.5;
    const h = r * Math.sin(Math.PI/3);
    const pts = [[cx,cy-r],[cx+h,cy-r/2],[cx+h,cy+r/2],[cx,cy+r],[cx-h,cy+r/2],[cx-h,cy-r/2]].map(p=>p.join(',')).join(' ');
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <clipPath id="h${uid}"><polygon points="${pts}"/></clipPath>
      <polygon points="${pts}" fill="${A}"/>
      <rect x="${cx}" y="${ow}" width="${r}" height="${cy-ow}" fill="${Y}" clip-path="url(#h${uid})"/>
      <rect x="${cx}" y="${cy}" width="${r}" height="${cy}" fill="#111" clip-path="url(#h${uid})"/>
      <polygon points="${pts}" fill="none" stroke="${oc}" stroke-width="${ow}"/>
    </svg>`;
  }

  if (shape === 'dh') {
    const r = S/2 - ow/2 - 0.5;
    const ir = r * 0.58;
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${oc}" stroke-width="${ow}"/>
      <polygon points="${cx},${cy-ir} ${cx+ir},${cy} ${cx},${cy}" fill="${A}"/>
      <polygon points="${cx+ir},${cy} ${cx},${cy+ir} ${cx},${cy}" fill="#222"/>
      <polygon points="${cx},${cy+ir} ${cx-ir},${cy} ${cx},${cy}" fill="#222"/>
      <polygon points="${cx-ir},${cy} ${cx},${cy-ir} ${cx},${cy}" fill="#eee"/>
      <polygon points="${cx},${cy-ir} ${cx+ir},${cy} ${cx},${cy+ir} ${cx-ir},${cy}" fill="none" stroke="#333" stroke-width="${sw}"/>
      <line x1="${cx}" y1="${cy-ir}" x2="${cx}" y2="${cy+ir}" stroke="#333" stroke-width="${sw*0.6}"/>
      <line x1="${cx-ir}" y1="${cy}" x2="${cx+ir}" y2="${cy}" stroke="#333" stroke-width="${sw*0.6}"/>
    </svg>`;
  }

  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><circle cx="${cx}" cy="${cy}" r="${S/2-2}" fill="#444"/></svg>`;
}

// ── Legend ────────────────────────────────────────────────────────────
const LEGEND_ITEMS = [
  { name:'M1', kg:250,  pre:false, label:'≤320 kg' },
  { name:'M2', kg:500,  pre:false, label:'500 kg' },
  { name:'M3', kg:750,  pre:false, label:'750 kg' },
  { name:'M4', kg:1000, pre:false, label:'1000 kg' },
  { name:'M5', kg:1000, pre:true,  label:'Pre' },
  { name:'M6', kg:1500, pre:false, label:'1500 kg' },
  { name:'M7', kg:2000, pre:false, label:'2000 kg' },
  { name:'M8', kg:2500, pre:false, label:'2500 kg' },
  { name:'DH',  kg:1000, pre:false, label:'Deadhang' },
  { name:'DH2', kg:1000, pre:true,  label:'DH Pre' },
];
document.getElementById('legendGrid').innerHTML = LEGEND_ITEMS.map(it =>
  `<div class="leg-item">${brMotorSVG(it.name, it.kg, it.pre, 30)}<span>${it.label}</span></div>`
).join('');

// ── State ─────────────────────────────────────────────────────────────
let dirUp = true;
let swapXY = false;
let lastRaw = '';
let lastGroups = [];
const doneSet = new Set();

// ── Helpers ───────────────────────────────────────────────────────────
function updateTotalBar() {
  const total = lastGroups.reduce((s,g) => s + g.motors.length, 0);
  const done = doneSet.size;
  const extra = swapXY ? ' · X↔Y' : '';
  document.getElementById('totalBar').textContent = done > 0
    ? `${done}/${total} abgehakt · ${lastGroups.length} Y-Ebenen${extra}`
    : `${total} Punkte · ${lastGroups.length} Y-Ebenen${extra}`;
}

function toggleDir() {
  dirUp = !dirUp;
  document.getElementById('dirBtn').textContent = dirUp ? '↑ DS' : '↓ US';
  if (lastGroups.length) document.getElementById('gridBody').innerHTML = renderGrid(lastGroups);
}

function toggleSwap() {
  swapXY = !swapXY;
  document.getElementById('swapBtn').classList.toggle('active', swapXY);
  document.getElementById('swapBtn').textContent = swapXY ? 'Y↔X' : 'X↔Y';
  if (lastRaw) {
    try {
      lastGroups = groupByY(parseCSV(lastRaw));
      updateTotalBar();
      document.getElementById('gridBody').innerHTML = renderGrid(lastGroups);
    } catch(e) {}
  }
}

function resetDone() {
  doneSet.clear();
  document.querySelectorAll('.mc.done').forEach(el => el.classList.remove('done'));
  updateTotalBar();
}

function toggleDone(key, el) {
  if (doneSet.has(key)) { doneSet.delete(key); el.classList.remove('done'); }
  else { doneSet.add(key); el.classList.add('done'); }
  updateTotalBar();
}

function goBack() {
  document.getElementById('viewScreen').style.display = 'none';
  document.getElementById('importScreen').style.display = 'block';
}

// ── CSV Parse ─────────────────────────────────────────────────────────
const SAMPLE = `Kettenzug-ID,Name,X,Y,Tragfähigkeit
1,SS3,0.00,0.00,2000
2,SS9,4.50,0.00,2000
3,LX1.1,-3.50,1.65,500
4,LX1.2,3.50,1.65,500
5,PA1,-2.50,1.70,1000
6,PA2,2.50,1.70,1000
7,CT2.1,0.00,2.45,2000
8,LXSL1.1,-5.00,2.49,500
9,LXSR1.1,5.00,2.49,500
10,VSL1,-4.00,3.20,1000
11,VSR1,4.00,3.20,1000
12,DH1,-2.00,4.33,1000
13,DH2,2.00,4.33,1500
14,ÜL1,-3.00,5.50,1000
15,ÜL2,3.00,5.50,1000
16,Stage+5,0.00,6.00,0
17,Ref.1,-5.00,7.00,0`;

function loadSample() { document.getElementById('csvText').value = SAMPLE; }

function parseCSV(raw) {
  const lines = raw.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('CSV zu kurz.');
  const sep = lines[0].includes(';') ? ';' : ',';
  const h = lines[0].split(sep).map(s => s.trim().replace(/^"|"$/g,'').toLowerCase());
  const fi = ns => { for (const n of ns) { const i = h.findIndex(hh => hh === n || hh.includes(n)); if (i >= 0) return i; } return -1; };
  const iX = fi(['x']), iY = fi(['y']);
  const iN = fi(['name','bezeichnung']);
  const iId = fi(['id','kettenzug-id','kettenzug']);
  const iT = fi(['tragfähigkeit','tragfaehigkeit','capacity','swl','load','lagerkraft']);
  if (iX < 0 || iY < 0) throw new Error('Keine X/Y-Spalten gefunden.');
  const motors = [];
  for (let i = 1; i < lines.length; i++) {
    const c = lines[i].split(sep).map(s => s.trim().replace(/^"|"$/g,''));
    let x = parseFloat(c[iX]?.replace(',','.'));
    let y = parseFloat(c[iY]?.replace(',','.'));
    if (isNaN(x) || isNaN(y)) continue;
    if (swapXY) { const tmp = x; x = y; y = tmp; }
    const kg = iT >= 0 ? parseFloat(c[iT]?.replace(',','.')) : 0;
    const name = iN >= 0 ? c[iN] : '';
    motors.push({ id: iId >= 0 ? c[iId] : String(i), name, x, y, kg: isNaN(kg) ? 0 : kg });
  }
  if (!motors.length) throw new Error('Keine gültigen Punkte.');
  return motors;
}

function groupByY(motors) {
  const TOL = 0.06;
  const sorted = [...motors].sort((a,b) => a.y - b.y);
  const groups = [];
  for (const m of sorted) {
    const g = groups.find(g => Math.abs(g.y - m.y) <= TOL);
    if (g) g.motors.push(m); else groups.push({ y: m.y, motors: [m] });
  }
  return groups;
}

function slSrSplit(motors) {
  if (!motors.length) return { sl:[], sr:[] };
  const xs = motors.map(m => m.x);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  let slRaw = motors.filter(m => m.x < cx).sort((a,b) => b.x - a.x);
  let srRaw = motors.filter(m => m.x >= cx).sort((a,b) => a.x - b.x);
  if (!slRaw.length && srRaw.length > 1) { slRaw = [srRaw.shift()]; }
  else if (!srRaw.length && slRaw.length > 1) { srRaw = [slRaw.shift()]; }

  // Pair by mirrored X distance
  const usedSR = new Array(srRaw.length).fill(false);
  const pairedSL = [], pairedSR = [];
  for (let i = 0; i < slRaw.length; i++) {
    const slM = slRaw[i];
    let bestJ = -1, bestDiff = Infinity;
    for (let j = 0; j < srRaw.length; j++) {
      if (usedSR[j]) continue;
      const diff = Math.abs(Math.abs(slM.x) - Math.abs(srRaw[j].x));
      if (diff < bestDiff) { bestDiff = diff; bestJ = j; }
    }
    pairedSL.push(slM);
    if (bestJ >= 0 && bestDiff < 0.5) { pairedSR.push(srRaw[bestJ]); usedSR[bestJ] = true; }
    else { pairedSR.push(null); }
  }
  for (let j = 0; j < srRaw.length; j++) {
    if (!usedSR[j]) { pairedSL.push(null); pairedSR.push(srRaw[j]); }
  }
  return { sl: pairedSL, sr: pairedSR };
}

function dsLabel(y, allY) {
  if (Math.abs(y) < 0.06) return 'NULL';
  const mn = Math.min(...allY), mx = Math.max(...allY);
  return y <= (mn + (mx-mn)*0.45) ? 'DS' : 'US';
}

function chipHtml(m, side) {
  const pre = m.name && (m.name.toLowerCase().includes('pre'));
  const icon = brMotorSVG(m.name, m.kg, pre, 28);
  const xStr = (m.x >= 0 ? '+' : '') + m.x.toFixed(2) + 'm';
  const isSL = side === 'sl';
  const key = (m.id + '_' + m.name).replace(/'/g,'');
  const isDone = doneSet.has(key);
  return `<div class="mc${isSL?' sl':''}${isDone?' done':''}" onclick="toggleDone('${key}',this)">
    ${icon}
    <div class="mc-meta">
      <span class="mn">${m.name || m.id}</span>
      <span class="mx">${xStr}</span>
    </div>
    <div class="check-dot"><div class="check-mark"></div></div>
  </div>`;
}

function renderGrid(groups) {
  const allY = groups.map(g => g.y);
  const ordered = dirUp ? [...groups].reverse() : [...groups];
  let html = '';
  for (const g of ordered) {
    const { sl, sr } = slSrSplit(g.motors);
    const label = dsLabel(g.y, allY);
    const isNull = label === 'NULL';
    const rowCount = Math.max(sl.length, sr.length, 1);
    for (let r = 0; r < rowCount; r++) {
      html += `<div class="cell sl">${sl[r] ? chipHtml(sl[r],'sl') : ''}</div>`;
      if (r === 0) {
        html += `<div class="row-mid${isNull?' null-row':''}" style="grid-row:span ${rowCount};">
          <span class="dl">${label}</span>
          <span class="yv">${g.y.toFixed(2)}m</span>
        </div>`;
      }
      html += `<div class="cell sr">${sr[r] ? chipHtml(sr[r],'sr') : ''}</div>`;
    }
  }
  return html;
}

function parseAndShow() {
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  const raw = document.getElementById('csvText').value.trim();
  if (!raw) { errBox.textContent = 'Kein Inhalt.'; errBox.style.display = 'block'; return; }
  try {
    lastRaw = raw;
    doneSet.clear();
    lastGroups = groupByY(parseCSV(raw));
    updateTotalBar();
    document.getElementById('gridBody').innerHTML = renderGrid(lastGroups);
    document.getElementById('importScreen').style.display = 'none';
    document.getElementById('viewScreen').style.display = 'flex';
  } catch(e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('csvText').value = ev.target.result; parseAndShow(); };
  r.readAsText(f);
});
const da = document.getElementById('dropArea');
da.addEventListener('dragover', e => e.preventDefault());
da.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('csvText').value = ev.target.result; parseAndShow(); };
  r.readAsText(f);
});
</script>
</body>
</html>
